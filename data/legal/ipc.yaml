# Indian Penal Code, 1860 — governs punishment for offences committed before 1 July 2024.
#
# EVERY record below is `verified: false`. Values were entered from general legal
# knowledge while building NyayaSetu, NOT checked against the official text.
# `punishment_summary` is a paraphrase, never a quotation of the statute.
# A system_admin must check each record against India Code / the Gazette and flip
# `verified` through the admin API (which is audit-logged). See docs/LEGAL_DATA.md.
act: IPC
act_name: Indian Penal Code, 1860 (Act 45 of 1860)
source: "India Code — The Indian Penal Code, 1860; classification per CrPC First Schedule / Section 320"
source_url: https://www.indiacode.nic.in/
applies_to_offences_before: 2024-07-01
records:
  - section: "34"
    title: Acts done by several persons in furtherance of common intention
    kind: liability_rule          # not an offence by itself; see rules.yaml derivations
    punishment_summary: No separate punishment; each person liable as if they did the act alone.
    verified: false

  - section: "109"
    title: Abetment, if the act abetted is committed
    kind: liability_rule
    punishment_summary: Same punishment as the offence abetted, where no express provision.
    verified: false

  - section: "120B"
    title: Punishment of criminal conspiracy
    kind: liability_rule
    punishment_summary: >-
      For conspiracy to commit an offence punishable with death, life imprisonment or rigorous
      imprisonment of two years or more — as abetment of that offence; otherwise up to six months.
    verified: false

  - section: "511"
    title: Attempting to commit offences punishable with imprisonment for life or other imprisonment
    kind: liability_rule
    punishment_summary: Up to one-half of the longest term provided for the offence, where no express provision.
    verified: false

  - section: "279"
    title: Rash driving or riding on a public way
    punishment_summary: Up to 6 months, or fine up to Rs 1,000, or both.
    max_imprisonment: {months: 6}
    cognizable: true
    bailable: true
    compoundable: "no"
    triable_by: any_magistrate
    verified: false

  - section: "290"
    title: Punishment for public nuisance in cases not otherwise provided for
    punishment_summary: Fine up to Rs 200 only.
